apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: cinevision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/cinevision/eureka-server:latest
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"