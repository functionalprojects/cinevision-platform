apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: cinevision
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: eureka-server
        image: 590396427103.dkr.ecr.us-east-1.amazonaws.com/cinevision/eureka-server:latest
        ports:
        - name: http                     # named port (must match service port name)
          containerPort: 8761
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        # Optional liveness and readiness probes (recommended)
        # livenessProbe:
        #   httpGet:
        #     path: /actuator/health/liveness
        #     port: 8761
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /actuator/health/readiness
        #     port: 8761
        #   initialDelaySeconds: 30
        #   periodSeconds: 10