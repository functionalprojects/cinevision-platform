apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinevision
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # Prometheus annotations (optional; frontend may not expose metrics)
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"   # Default; adjust if your frontend serves metrics
    spec:
      containers:
      - name: frontend
        image: 590396427103.dkr.ecr.us-east-1.amazonaws.com/cinevision/frontend:latest
        ports:
        - name: http                     # named port (must match service port name)
          containerPort: 80
          protocol: TCP
        # Optional liveness and readiness probes (adjust path if needed)
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 80
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: 80
        #   initialDelaySeconds: 30
        #   periodSeconds: 10