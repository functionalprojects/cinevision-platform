apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinevision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 590396427103.dkr.ecr.us-east-1.amazonaws.com/cinevision/frontend:latest
        ports:
        - containerPort: 80