apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
  namespace: cinevision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      containers:
      - name: movie-service
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/cinevision/movie-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/cine_vision"