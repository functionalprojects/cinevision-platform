spring:
  application:
    name: api-gateway

  # Spring Cloud Gateway routes
  cloud:
    gateway:
      routes:
        - id: movieService
          uri: lb://movieService
          predicates:
            - Path=/api/movie/**

        - id: userService
          uri: lb://userService
          predicates:
            - Path=/api/user/**

        - id: eureka-server
          uri: http://eureka-server:8761
          predicates:
            - Path=/eureka/web
          filters:
            - SetPath=/

        - id: eureka-server-static
          uri: http://eureka-server:8761
          predicates:
            - Path=/eureka/**

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      # Default filters (deduplicate response headers)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  # Zipkin tracing
  zipkin:
    base-url: http://zipkin:9411

  # Sleuth is replaced by Micrometer tracing; we just enable sampling
  sleuth:
    sampler:
      probability: 1.0

# Eureka client
eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@eureka-server:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Server port
server:
  port: 8080

# Actuator endpoints (for Kubernetes probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE