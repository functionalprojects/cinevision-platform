spring:
  application:
    name: userService

  # MongoDB configuration
  data:
    mongodb:
      uri: mongodb://rootuser:rootpass@localhost:27017/user?authSource=admin
      auto-index-creation: true

  # Zipkin and Sleuth (Micrometer)
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

# Eureka client
eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

# JWT secret (use environment variable in production)
jwt:
  secret:
    key: secret_secret_secret_secret_secret_secret_secret_secret_secret_secret

# Server port (random if 0, but fixed for dev)
server:
  port: 0

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always